<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painted roots · material study</title>
<style>
  * { box-sizing: border-box; } body { margin:0; background:#242723; color:#e4dfd1; font:14px system-ui; }
  canvas { display:block; width:100vw; height:100vh; }
  header { position:absolute; top:20px; left:24px; max-width:calc(100vw - 48px); padding:12px; background:#242723; pointer-events:none; }
  header p { color:#d5d7ca; font-size:11px; letter-spacing:.17em; text-transform:uppercase; }
  h1 { margin:8px 0; font:clamp(24px,3vw,36px) Georgia,serif; font-weight:normal; }
  footer { position:absolute; bottom:16px; left:24px; right:24px; padding:12px; background:#242723; display:flex; flex-wrap:wrap; gap:16px; align-items:center; color:#d5d7ca; }
  a { color:inherit; } button { color:#e4dfd1; background:#343930; border:1px solid #626954; padding:9px 14px; cursor:pointer; }
</style>
<header><p>Roots / surface & growth study</p><h1>Wood, shaped by growth.</h1><span>Painted bark · longitudinal grain · tapered branching</span></header>
<canvas aria-label="Interactive 3D study of painterly branching roots"></canvas>
<footer><button id="reset">Reset view</button><button id="light">Cool light</button><span>Drag to orbit · scroll to inspect the bark</span><a href="/editor.html">Level editor ↗</a></footer>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { rootGeometry, rootBarkMaterial } from '/src/render3d/rootMesh.ts';
    import { fuseRootForks } from '/src/render3d/rootFork.ts';
  import { DEFAULT_ROOT_COLOR } from '/src/level/levelFormat.ts';
  const renderer = new THREE.WebGLRenderer({ canvas:document.querySelector('canvas'), antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#242723');
  const camera = new THREE.PerspectiveCamera(34,1,.01,100);
  const controls = new OrbitControls(camera,renderer.domElement);
  controls.enableDamping = true;
  function reset() {
    const distance = Math.max(9.6, 6.1 / (2 * Math.tan(17 * Math.PI / 180) * camera.aspect));
    camera.position.set(0,0.3,distance); controls.target.set(0,-0.15,0); controls.update();
  }
  reset();
  scene.add(new THREE.HemisphereLight('#d9e1cd','#706255',2.1));
  const key = new THREE.DirectionalLight('#fff1d8',3.2); key.position.set(-3,4,6); scene.add(key);
  key.castShadow = true; key.shadow.mapSize.set(2048,2048);
  Object.assign(key.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:.1,far:20});
  key.shadow.normalBias = .015;
  const fill = new THREE.DirectionalLight('#b7cad4',1.6); fill.position.set(4,-1,3); scene.add(fill);
  const material = rootBarkMaterial(DEFAULT_ROOT_COLOR);
    const roots = new Map();
  function branch(width,tip,verts,seed,trunk=false) {
    const geometry = rootGeometry({width,tip,verts},{seed,trunk});
    if (!geometry) return;
      roots.set(seed, geometry);
  }
  // An exposed structural root: an uneven main axis, lateral roots leaving at
  // unequal stations, and progressively finer branching. These are the same
  // authored curves and live material the editor uses, in metres (y down).
  branch(.40,.025,[
    {x:-2.3,y:-.62,outX:.45,outY:.18},
    {x:-1.2,y:-.05,inX:-.4,inY:-.2,outX:.5,outY:.25},
    {x:.15,y:.08,inX:-.5,inY:.08,outX:.5,outY:-.08},
    {x:1.48,y:.24,inX:-.4,inY:-.24,outX:.4,outY:.24},
    {x:2.6,y:.65,inX:-.45,inY:-.04},
  ],2,true);
  branch(.21,.013,[
    {x:-1.2,y:-.05,outX:.18,outY:-.3},
    {x:-.65,y:-.78,inX:-.3,inY:.07,outX:.34,outY:-.08},
    {x:.52,y:-1.0,inX:-.35,inY:-.09},
  ],5);
  branch(.12,.012,[
    {x:-.65,y:-.78,outX:-.05,outY:-.3},
    {x:-.8,y:-1.37,inX:.2,inY:.05,outX:-.2,outY:-.05},
    {x:-1.4,y:-1.52,inX:.22,inY:0},
  ],7);
  branch(.19,.014,[
    {x:.15,y:.08,outX:.07,outY:.25},
    {x:.56,y:.78,inX:-.3,inY:-.05,outX:.3,outY:.05},
    {x:1.65,y:1.1,inX:-.35,inY:-.18},
  ],11);
  branch(.085,.009,[
    {x:.56,y:.78,outX:-.05,outY:.2},
    {x:.18,y:1.22,inX:.24,inY:-.09,outX:-.2,outY:.07},
    {x:-.43,y:1.39,inX:.2,inY:0},
  ],14);
  branch(.09,.01,[
    {x:1.48,y:.24,outX:.08,outY:-.18},
    {x:1.9,y:-.33,inX:-.2,inY:.12,outX:.2,outY:-.12},
    {x:2.4,y:-.42,inX:-.2,inY:-.06},
  ],19);
    for (const geometry of fuseRootForks(roots, new Map([[5,2],[7,5],[11,2],[14,11],[19,2]])).values()) {
      const mesh = new THREE.Mesh(geometry,material); mesh.castShadow=mesh.receiveShadow=true; scene.add(mesh);
    }
    const back = new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#34392e',roughness:1}));
  back.position.z=-.4; back.receiveShadow=true; scene.add(back);
  function resize() { renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); reset(); }
  addEventListener('resize',resize); resize();
  document.querySelector('#reset').onclick = reset;
  let cool=false;
  document.querySelector('#light').onclick = e => { cool=!cool; key.color.set(cool?'#c5ddf1':'#fff1d8'); e.target.textContent=cool?'Warm light':'Cool light'; };
  renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>rope</title>
    <!-- Installable full-screen web app: manifest drives Android/Chrome
         (display: fullscreen); the apple-* metas do the same on iOS Safari,
         which ignores the manifest's display mode. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1f2430" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="rope" />
    <style>
      /* The play frame is a fixed 16:9, centred and scaled to fit (see
         src/render/viewport.ts); #frame is sized in px by the game, and the
         space left over on the long axis is these letterbox bars. */
      html, body { margin: 0; height: 100%; background: #1f2430; overflow: hidden; overscroll-behavior: none; }
      body { display: flex; align-items: center; justify-content: center; }
      #frame { position: relative; }
      /* Two canvases on one rectangle: the WebGL scene underneath and the 2D
         overlay on top (see src/render3d/scene.ts). Both are sized by one call
         to `fitCanvas`, so a pixel on one is a pixel on the other. Pointer
         events belong to the top canvas alone - the scene below is drawn, never
         clicked. In 2D mode `#scene` simply stays empty and hidden. */
      #frame canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
      #scene { pointer-events: none; }
      #game { image-rendering: pixelated; cursor: crosshair; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="frame"><canvas id="scene"></canvas><canvas id="game"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

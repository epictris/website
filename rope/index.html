<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>rope</title>
    <!-- Installable full-screen web app: manifest drives Android/Chrome
         (display: fullscreen); the apple-* metas do the same on iOS Safari,
         which ignores the manifest's display mode. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1f2430" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="rope" />
    <style>
      /* The play frame is a fixed 16:9, centred and scaled to fit (see
         src/render/viewport.ts); #frame is sized in px by the game, and the
         space left over on the long axis is these letterbox bars. */
      /* The page keeps the desktop cursor: the loading screen ends at a button,
         and a button is aimed at with the pointer the player can see. Only the
         GAME hides it - `main.ts` on the canvas for the ball controller, where
         the reticle stands in for it (and the pointer lock takes it outright
         once PLAY has been pressed). */
      html, body { margin: 0; height: 100%; background: #1f2430; overflow: hidden; overscroll-behavior: none; }
      /* `display: flex` on #loading below beats the UA's own [hidden] rule, so
         the level select taking the screen off the page has to say so here. */
      [hidden] { display: none !important; }
      body { display: flex; align-items: center; justify-content: center; }
      #frame { position: relative; }
      /* Two canvases on one rectangle: the WebGL scene underneath and the 2D
         overlay on top (see src/render3d/scene.ts). Both are sized by one call
         to `fitCanvas`, so a pixel on one is a pixel on the other. Pointer
         events belong to the top canvas alone - the scene below is drawn, never
         clicked. In 2D mode `#scene` simply stays empty and hidden. */
      #frame canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
      #scene { pointer-events: none; }
      #game { image-rendering: pixelated; cursor: crosshair; touch-action: none; }

      /* The loading screen. It is markup rather than something the game builds,
         because the wait it covers STARTS BEFORE THE GAME EXISTS: three.js and
         the level code are a download of their own, and a screen painted by
         src/render/loadingScreen.ts could only appear once that download had
         already landed. Here it is on the first paint, and the module inherits
         it (see `LoadingScreen`) instead of creating it.
         Over the letterbox bars as well as the frame, so the page is one flat
         colour while it waits - #1f2430 is the tris.sh background. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        background: #1f2430;
        color: #cbccc6;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.04em;
        /* No fade. The screen is removed from the DOM in the same animation
           frame that draws the first frame of the level, so the swap is one
           compositor frame: bar, then game. A fade would put a quarter of a
           second of half-lit menu between the two, which is a quarter of a
           second of nothing happening after the wait is already over. */
      }
      /* Square corners and a hairline track: the bar is a terminal's idea of a
         bar, not a rounded pill. */
      #loading-track {
        width: min(320px, 60vw);
        height: 6px;
        background: rgba(203, 204, 198, 0.16);
        overflow: hidden;
      }
      /* `--p` is the fraction of the download that has arrived, written by
         src/render/loadingScreen.ts. It is scaled rather than resized so the bar
         costs no layout, and the transition is short and LINEAR: it smooths the
         step between two frames' readings without ever easing ahead of the
         bytes. Nothing animates on its own - an empty bar means nothing has
         arrived, which is a thing worth being able to see. */
      #loading-fill {
        width: 100%;
        height: 100%;
        background: #ffffff;
        transform-origin: left center;
        transform: scaleX(var(--p, 0));
        transition: transform 140ms linear;
      }
      /* The only movement on the screen is the bar reporting bytes, and the
         transition is what stops it stepping between readings - but a reader who
         has asked for no motion gets the steps. */
      @media (prefers-reduced-motion: reduce) {
        #loading-fill { transition: none; }
      }
      /* THE LEVEL SELECT. Markup rather than something the game builds, for the
         reason the loading screen is: a bare `/` must not download three.js to
         show a list of six words, so the menu page never loads the app at all
         (see the module tag at the bottom of this file). What paints it is the
         inlined store, which is already running during HTML parsing.
         The same terminal idiom as the screen it replaces: the #1f2430 page,
         #cbccc6 text, monospace, hairline rules, square corners, and the
         #65bddb accent kept for the two things that are special - the
         introduction and whichever row has the keyboard. */
      #menu {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1f2430;
        color: #cbccc6;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.04em;
        /* The gutter is the page's, so a phone never scrolls sideways. */
        padding: 2rem 16px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      #menu[data-show="1"] { display: flex; }
      #menu-inner { width: min(420px, 100%); }
      /* The heading is an INSTRUCTION rather than the game's name, which is
         what sets the tracking: 0.34em suited one wide-spaced word and stretches
         a sentence into something nobody reads as a sentence. 0.18em is the
         page's own voice (the form's eyebrow carries 0.22em) at a width three
         words can be read across. The name is still on the tab. */
      #menu h1 {
        font: inherit;
        font-weight: normal;
        letter-spacing: 0.18em;
        margin: 0 0 1.5rem;
        color: #65bddb;
      }
      #menu-list { list-style: none; margin: 0; padding: 0; }
      /* A row is an ANCHOR, so middle-click opens a level in a tab and a screen
         reader reads a list of links - which is what this is. Picking a level is
         a navigation (see docs/levels.md): one page load is one session and one
         level, and an in-page switch would break every part of that. */
      #menu-list a {
        display: flex;
        align-items: baseline;
        gap: 1ch;
        padding: 0.7rem 1ch;
        color: inherit;
        text-decoration: none;
        border: 1px solid transparent;
        /* Comfortably past the 44px touch target. */
        min-height: 44px;
        box-sizing: border-box;
      }
      #menu-list a:hover,
      #menu-list a:focus-visible,
      #menu-list a[data-at="1"] {
        border-color: #65bddb;
        outline: none;
      }
      /* The introduction sits above a rule rather than being sorted into place:
         a level called "Zither" that is the introduction is still the first
         thing a new player is offered. */
      #menu-list li[data-intro="1"] {
        border-bottom: 1px solid #313244;
        margin-bottom: 0.5rem;
        padding-bottom: 0.5rem;
      }
      #menu-list li[data-intro="1"] a { color: #65bddb; }
      .menu-title { flex: 1; }
      /* Completion and the last rating, from `rope.progress` in localStorage.
         Dim, because they are a record of what the player has done rather than
         part of the offer. */
      .menu-mark { color: #8a8f98; }
      .menu-stars { color: #8a8f98; letter-spacing: 0.1em; }
      .menu-rate {
        color: #8a8f98;
        text-decoration: underline;
        cursor: pointer;
      }
      .menu-rate:hover { color: #cbccc6; }
      #menu-note { color: #8a8f98; margin: 0 0 1rem; }
      #menu-note:empty { display: none; }

      /* THE FEEDBACK FORM, over a level that has just been finished and over
         the level select's own list. Markup rather than something a module
         builds, for the third time on this page and for the third version of
         the same reason: the menu page never loads the app, so the form has to
         exist without it (see src/render/completionForm.ts).
         Same idiom again - the flat page, hairline borders, square corners,
         #65bddb only on the thing being chosen. */
      #complete {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Over the level rather than instead of it: the scene is still being
           drawn behind this, at the pose the last step left. */
        background: rgba(31, 36, 48, 0.88);
        color: #cbccc6;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.04em;
        padding: 2rem 16px;
        box-sizing: border-box;
        z-index: 10;
      }
      #complete-panel {
        width: min(420px, 100%);
        border: 1px solid #313244;
        background: #1f2430;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      #complete-eyebrow { color: #65bddb; letter-spacing: 0.22em; margin: 0 0 0.35rem; }
      #complete-heading { margin: 0 0 1rem; font: inherit; font-weight: normal; }
      /* WHAT THE RUN TOOK, which every crossing reports whether or not there is
         anything to ask. The label is dim and the figure is not: the number is
         the thing being read, and a run is not a time trial - nothing else on
         the panel competes with it for the accent. */
      #complete-time {
        margin: 0 0 1.5rem;
        display: flex;
        gap: 1ch;
        align-items: baseline;
      }
      #complete-time-label { color: #8a8f98; letter-spacing: 0.16em; }
      #complete-time-value { color: #cbccc6; }
      /* THE FEEDBACK HALF, separated from the heading above and the exits below
         by a rule, because it is the part of the panel that is not always here:
         it is asked for on a first crossing and on one where nothing has been
         sent yet, and left out otherwise (see src/render/completionForm.ts). */
      #complete-ask-section {
        border-top: 1px solid #313244;
        padding-top: 1.25rem;
      }
      /* The question each control is the answer to. Without it a row of stars
         is a rating of something unstated - the level, the run, the game - and
         five stars for "how fun" is a different answer from five stars for
         "how hard". Now that the panel asks two of them, the difference
         between the two questions is the whole point of labelling them. */
      .complete-ask { margin: 0 0 0.5rem; color: #8a8f98; }
      #complete-stars { display: flex; gap: 0.5ch; margin-bottom: 1.25rem; }
      .complete-star {
        /* A star is bigger than the body text on purpose - it is the one thing
           on the panel being aimed at - and it is the one place a font size is
           set, because a 13px glyph is not a 44px touch target. */
        font-size: 24px;
        line-height: 1;
        width: 44px;
        height: 44px;
        border: 1px solid transparent;
        background: transparent;
        color: #8a8f98;
        cursor: pointer;
        padding: 0;
      }
      .complete-star[data-on="1"] { color: #65bddb; }
      .complete-star:hover, .complete-star:focus-visible { border-color: #65bddb; outline: none; }
      /* THE DIFFICULTY SCALE: five cells carrying their own words, and exactly
         one of them lit. The words are on the cells rather than as a caption at
         each end, because five bare boxes between "too easy" and "too hard" is
         a 1..5 ramp again and the whole reason this is not a second row of
         stars is that the MIDDLE is the good answer (see `Difficulty` in
         src/playtest/feedback.ts).
         The labels wrap to two lines at the panel's width and to three on a
         narrow phone, so the height is a minimum rather than a size and the
         row's cells stretch to the tallest of them. */
      #complete-difficulty { display: flex; gap: 0.5ch; margin-bottom: 1.25rem; }
      .complete-diff {
        flex: 1 1 0;
        /* Without this a flex item refuses to go below its longest word and
           the row overflows the panel at a phone's width. */
        min-width: 0;
        min-height: 44px;
        padding: 0.4rem 0.2rem;
        border: 1px solid #313244;
        background: transparent;
        color: #8a8f98;
        font: inherit;
        letter-spacing: inherit;
        line-height: 1.3;
        text-align: center;
        overflow-wrap: break-word;
        cursor: pointer;
      }
      .complete-diff[data-on="1"] { color: #65bddb; border-color: #65bddb; }
      .complete-diff:hover, .complete-diff:focus-visible { border-color: #65bddb; outline: none; }
      /* NARROW ENOUGH AND THE SCALE STANDS UP. Five cells side by side need
         about eight monospace columns each to hold "Way too" on one line, which
         is a 480px viewport; under that the row either breaks words down the
         middle or overflows. Stacked, each answer gets its own line and reads
         as what it is, and the order top-to-bottom is the same order the scale
         runs in left-to-right - easiest first - so the middle is still the
         middle. */
      @media (max-width: 480px) {
        #complete-difficulty { flex-direction: column; gap: 0; }
        .complete-diff {
          text-align: left;
          padding: 0.6rem 1ch;
          /* One hairline between cells rather than two, so a stacked scale
             reads as one control instead of five buttons. */
          border-bottom-width: 0;
        }
        .complete-diff:last-child { border-bottom-width: 1px; }
        /* The lit one needs its whole outline back, or its bottom edge is the
           next cell's missing border. */
        .complete-diff[data-on="1"], .complete-diff:hover, .complete-diff:focus-visible {
          border-bottom-width: 1px;
          margin-bottom: -1px;
        }
      }
      #complete-comment {
        width: 100%;
        box-sizing: border-box;
        min-height: 5.5rem;
        resize: vertical;
        background: #1f2430;
        color: #cbccc6;
        border: 1px solid #313244;
        font: inherit;
        letter-spacing: inherit;
        padding: 0.6rem;
      }
      #complete-comment:focus { border-color: #65bddb; outline: none; }
      /* SUBMIT SITS WITH THE FEEDBACK, not with the exits, because it is not
         one: sending says nothing about what to play next and does not close
         the panel (see src/render/completionForm.ts). It is the width of its
         own words rather than a third of the row, so it cannot be mistaken for
         one of the three ways on. */
      #complete-send {
        display: flex;
        gap: 1.5ch;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 1.25rem;
      }
      #complete-submit {
        min-height: 44px;
        padding: 0 2ch;
        border: 1px solid rgba(203, 204, 198, 0.45);
        background: transparent;
        color: #cbccc6;
        font: inherit;
        letter-spacing: 0.16em;
        cursor: pointer;
      }
      #complete-submit:hover, #complete-submit:focus-visible {
        background: rgba(203, 204, 198, 0.12);
        border-color: #cbccc6;
        outline: none;
      }
      /* Submit with nothing said is a round trip that says nothing, and Submit
         with what was just sent appends the same answer twice - so it is OFF in
         both cases (see `render/completionForm.ts`). Dimmed and `not-allowed`
         rather than hidden: a button that appears when you type is a button
         nobody knew was coming. */
      #complete-submit:disabled {
        color: #5b6068;
        border-color: #2a2f3c;
        cursor: not-allowed;
      }
      #complete-submit:disabled:hover { background: transparent; border-color: #2a2f3c; }
      #complete-thanks { color: #65bddb; }
      /* THE WAYS ON, below a rule of their own so that leaving is plainly a
         separate decision from rating. Built by the module, since how many
         there are depends on where the panel came from - the last level in the
         list has no Next Level to offer. */
      #complete-buttons {
        display: flex;
        gap: 1ch;
        margin-top: 1.5rem;
        border-top: 1px solid #313244;
        padding-top: 1.5rem;
      }
      #complete-buttons button {
        flex: 1;
        min-height: 44px;
        border: 1px solid #313244;
        background: transparent;
        color: #8a8f98;
        font: inherit;
        letter-spacing: 0.16em;
        cursor: pointer;
        padding: 0 0.5ch;
      }
      /* The one the panel leads with. On a finished level that is Retry: the
         player who just crossed the line and wants another go is the one who
         should not have to read the row. */
      #complete-buttons button[data-primary="1"] {
        color: #cbccc6;
        border-color: rgba(203, 204, 198, 0.45);
      }
      #complete-buttons button:hover, #complete-buttons button:focus-visible {
        background: rgba(203, 204, 198, 0.12);
        border-color: #cbccc6;
        color: #cbccc6;
        outline: none;
      }
      /* Equal thirds are tidy until a third of the row is narrower than "Next
         Level", which on a phone it is: the label wraps to two lines and stands
         the row up beside two single-line neighbours. Under 480px the buttons
         take their own width instead and share what is left over, which fits
         all three on one line; `wrap` is the floor under that, so a viewport
         narrow enough to beat even that stacks them rather than overflowing. */
      @media (max-width: 480px) {
        #complete-buttons { flex-wrap: wrap; }
        #complete-buttons button { flex: 1 1 auto; }
      }
    </style>
  </head>
  <body>
    <div id="frame"><canvas id="scene"></canvas><canvas id="game"></canvas></div>
    <div id="loading">
      <div id="loading-track"><div id="loading-fill"></div></div>
      <div>Mouse recommended</div>
    </div>
    <div id="menu">
      <div id="menu-inner">
        <h1>Choose a level</h1>
        <p id="menu-note"></p>
        <ul id="menu-list"></ul>
      </div>
    </div>
    <div id="complete" hidden>
      <div id="complete-panel">
        <p id="complete-eyebrow">Finished</p>
        <h2 id="complete-heading"></h2>
        <p id="complete-time" hidden>
          <span id="complete-time-label">Time</span><span id="complete-time-value"></span>
        </p>
        <div id="complete-ask-section" hidden>
          <p class="complete-ask">How fun was this level?</p>
          <div id="complete-stars" role="group" aria-label="How fun was this level?"></div>
          <p class="complete-ask">How was the difficulty?</p>
          <div id="complete-difficulty" role="group" aria-label="How was the difficulty?"></div>
          <textarea id="complete-comment" placeholder="Anything to say about it? (optional)"></textarea>
          <div id="complete-send">
            <button id="complete-submit" type="button">Send</button>
            <span id="complete-thanks" hidden>Thanks - that is saved.</span>
          </div>
        </div>
        <div id="complete-buttons"></div>
      </div>
    </div>
    <!-- THE APP IS LOADED ONLY WHERE THERE IS SOMETHING TO PLAY. A bare `/` is
         the level select, which the inlined store paints on its own, so this
         import must not be a static `src=`: vite would make it the page's entry
         and the menu would pull down three.js and the whole level graph to draw
         a list. The store decides (see `render3d/store.ts`) and sets the flag
         this reads. -->
    <script type="module">
      if (window.__ropePlay !== false) await import("/src/main.ts");
      // The level select is on screen instead. Picking a level there boots the
      // app into THIS document rather than navigating to the level's own page:
      // fullscreen and the pointer lock are granted to that press and neither
      // survives a navigation, so a link would hand both straight back (see
      // `startOnClick` in render3d/store.ts). The import stays inside this tag
      // so vite still resolves it to the built chunk.
      else window.__ropeBoot = () => void import("/src/main.ts");
    </script>
  </body>
</html>

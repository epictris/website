name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'clipboard/**'
      - 'pool/**'
      - 'rope/**'
      - 'Dockerfile'
      - 'compose.yml'
      - 'Caddyfile'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      deploy: ${{ steps.set-matrix.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'app/**'
              - 'Dockerfile'
            clipboard:
              - 'clipboard/**'
            pool:
              - 'pool/**'
            rope:
              - 'rope/**'
            deploy-config:
              - 'compose.yml'
              - 'Caddyfile'
              - 'deploy/**'
              - '.github/workflows/deploy.yml'

      - name: Build service matrix
        id: set-matrix
        run: |
          matrix='[]'
          add() { matrix=$(jq -c ". + [{\"name\":\"$1\",\"context\":\"$2\",\"image\":\"$3\"}]" <<<"$matrix"); }
          if [ "${{ steps.filter.outputs.website }}" = "true" ]; then
            add website . "ghcr.io/${{ github.repository }}"
          fi
          if [ "${{ steps.filter.outputs.clipboard }}" = "true" ]; then
            add clipboard ./clipboard "ghcr.io/${{ github.repository }}/clipboard"
          fi
          if [ "${{ steps.filter.outputs.pool }}" = "true" ]; then
            add pool ./pool "ghcr.io/${{ github.repository }}/pool"
          fi
          if [ "${{ steps.filter.outputs.rope }}" = "true" ]; then
            add rope ./rope "ghcr.io/${{ github.repository }}/rope"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          if [ "$matrix" != "[]" ] || [ "${{ steps.filter.outputs.deploy-config }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      # A plain checkout: rope's 3D props are NOT in git. They are fetched from a
      # GitHub Release inside the Docker build (see rope/Dockerfile), which is
      # what makes an asset deletable - see "Prop assets" in rope/CLAUDE.md.
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ matrix.service.image }}:latest
            ${{ matrix.service.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          # The image has no `.git`; rope stamps recordings with this instead
          # (see rope/src/sim/treeStamp.ts). Harmless for the other services.
          build-args: |
            GIT_COMMIT=${{ github.sha }}

  deploy:
    needs: [changes, build]
    # A manual run changes no files, so the paths filter alone would skip it; it
    # is how a rotated ROPE_ADMIN_HASH reaches the host without a code change.
    if: always() && (needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch') && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync compose and Caddy config
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            compose.yml Caddyfile deploy/host-setup.sh ubuntu@${{ vars.SSH_HOST }}:/opt/website/

      # Host state the containers depend on: the playtest directory, and the
      # nightly backup to Object Storage when OCI_OS_NAMESPACE is set
      # (terraform output `object_storage_namespace`, as a repository variable).
      - name: Configure host
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ vars.SSH_HOST }} \
            "sudo OCI_OS_NAMESPACE='${{ vars.OCI_OS_NAMESPACE }}' bash /opt/website/host-setup.sh"

      # Runtime secrets, written whole on every deploy so a rotated secret is a
      # re-run away. Piped over stdin so the `$` signs in a bcrypt hash never
      # meet a remote shell; single-quoted in the file because compose reads
      # .env with dotenv rules. An unset secret fails here rather than starting
      # Caddy with an empty hash, which would refuse the whole config.
      - name: Write runtime secrets
        run: |
          hash='${{ secrets.ROPE_ADMIN_HASH }}'
          if [ -z "$hash" ]; then echo "ROPE_ADMIN_HASH secret is not set"; exit 1; fi
          printf "ROPE_ADMIN_HASH='%s'\n" "$hash" \
            | ssh -i ~/.ssh/deploy_key ubuntu@${{ vars.SSH_HOST }} "umask 077 && cat > /opt/website/.env"

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ vars.SSH_HOST }} \
            "export WEBSITE_IMAGE=ghcr.io/${{ github.repository }}:latest \
             && export CLIPBOARD_IMAGE=ghcr.io/${{ github.repository }}/clipboard:latest \
             && export POOL_IMAGE=ghcr.io/${{ github.repository }}/pool:latest \
             && export ROPE_IMAGE=ghcr.io/${{ github.repository }}/rope:latest \
             && docker compose -f /opt/website/compose.yml up -d --pull always \
             && docker compose -f /opt/website/compose.yml restart caddy"
